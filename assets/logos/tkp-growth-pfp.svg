<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;display=swap');
      .bg { fill: #7C3AED; }
      .wordmark { font-family: 'Bebas Neue', 'Arial Black', sans-serif; font-size: 420px; fill: #FFFFFF; letter-spacing: 6px; }
      .sub { font-family: 'Bebas Neue', 'Arial Black', sans-serif; font-size: 64px; fill: #FACC15; letter-spacing: 14px; }
      .bolt { fill: #FF6B6B; }
    </style>
    <!-- Lightning bolt clip path -->
    <clipPath id="circleClip">
      <circle cx="400" cy="400" r="396"/>
    </clipPath>
  </defs>
  <!-- Background -->
  <rect width="800" height="800" class="bg" rx="0"/>
  <!-- TKP wordmark -->
  <text x="400" y="490" text-anchor="middle" class="wordmark">TKP</text>
  <!-- Accent lightning bolts flanking wordmark -->
  <polygon points="170,360 210,430 190,430 230,510 180,450 200,450" class="bolt"/>
  <polygon points="630,360 590,430 610,430 570,510 620,450 600,450" class="bolt"/>
  <!-- Subtitle -->
  <text x="400" y="620" text-anchor="middle" class="sub">GROWTH</text>
</svg>
