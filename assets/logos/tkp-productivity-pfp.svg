<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@700&amp;display=swap');
      .bg { fill: #1A2744; }
      .wordmark { font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 340px; fill: #F8F7F4; }
      .accent { stroke: #C9A84C; stroke-width: 6; }
      .sub { font-family: 'DM Sans', sans-serif; font-weight: 400; font-size: 48px; fill: #C9A84C; letter-spacing: 8px; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="800" height="800" class="bg" rx="0"/>
  <!-- Top accent line -->
  <line x1="120" y1="120" x2="680" y2="120" class="accent"/>
  <!-- TKP wordmark -->
  <text x="400" y="530" text-anchor="middle" class="wordmark">TKP</text>
  <!-- Bottom accent line -->
  <line x1="120" y1="680" x2="680" y2="680" class="accent"/>
  <!-- Subtitle -->
  <text x="400" y="740" text-anchor="middle" class="sub">PRODUCTIVITY</text>
</svg>
